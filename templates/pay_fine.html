{% extends "base.html" %}

{% block title %}Library Application{% endblock %}

{% block content %}
 <body>
     <h2>Pay a Fine</h2>
     
     {% if success_message %}
        <div class="message">
        <p>{{ success_message }}</p>
        </div>
    {% endif %}
    {% if error_message %}
        <div class="message error">
        <p>{{ error_message }}</p>
        </div>
    {% endif %}
     
     <form method="POST" action="/pay_fine">
        <div>
        <label for="fine_id">Select Fine:</label>
         <select name="fine_id" required>
             <option value="" selected disabled> </option>
             {% for fine in fines %}
                 <option value="{{ fine.fine_id }}">
                     [Fine ID: {{ fine.fine_id }}] {{ fine.title }} ({{ fine.item_type }}) - Borrower: {{ fine.borrower_name }} - Fine: ${{ fine.fine_amount }}
                 </option>
             {% endfor %}
         </select>
        </div> 
         
         <button type="submit">Pay</button>
     </form>
{% endblock %}
