{% extends "base.html" %}

{% block title %}Library Application{% endblock %}

{% block content %}
  <h2>Volunteer for the Library</h2>
  
  {% if message %}
    <div class="message">
      <p>{{ message }}</p>
    </div>
  {% endif %}
  
  <form method="POST" action="{{ url_for('volunteer') }}">
    <div>
      <label for="person_id">Select Your Person:</label>
      <select id="person_id" name="person_id" required>
        <option value=""> </option>
        {% for person in people %}
          <option value="{{ person['person_id'] }}">
            {{ person['name'] }} (ID: {{ person['person_id'] }})
          </option>
        {% endfor %}
      </select>
    </div>
    
    <button type="submit">Volunteer</button>
  </form>
{% endblock %}
