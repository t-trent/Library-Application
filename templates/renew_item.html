{% extends "base.html" %}

{% block title %}Library Application{% endblock %}

{% block content %}
  <h2>Renew an Item</h2>
  
  {% if success_message %}
    <div class="message">
      <p>{{ success_message }}</p>
    </div>
  {% endif %}
  {% if error_message %}
    <div class="message error">
      <p>{{ error_message }}</p>
    </div>
  {% endif %}
  
  <form method="POST" action="{{ url_for('renew_item') }}">
    <div>
      <label for="borrowing_id">Select a Borrowing:</label>
      <select id="borrowing_id" name="borrowing_id" required>
        <option value=""> </option>
        {% for borrowing in borrowings %}
          <option value="{{ borrowing['borrowing_id'] }}">
            {{ borrowing['title'] }} ({{ borrowing['item_type'] }}) - Borrowed by {{ borrowing['borrower_name'] }} (Due Date: {{ borrowing['due_date'] }})
          </option>
        {% endfor %}
      </select>
    </div>
    
    <div>
      <label for="personnel_id">Librarian (Personnel):</label>
      <select id="personnel_id" name="personnel_id" required>
        <option value=""> </option>
        {% for librarian in librarians %}
          <option value="{{ librarian['person_id'] }}">
            {{ librarian['name'] }} [ID: {{ librarian['person_id'] }}] - {{ librarian['role'] }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label for="new_due_date">New Due Date:</label>
      <input type="date" id="new_due_date" name="new_due_date" required>
    </div>

    <button type="submit">Renew</button>
  </form>
  
{% endblock %}
