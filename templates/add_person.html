{% extends "base.html" %}

{% block title %}Add New Person{% endblock %}

{% block content %}
  <h2>Add New Person</h2>
  
  {% if success_message %}
    <div class="message success">
      <p>{{ success_message }}</p>
    </div>
  {% endif %}
  {% if error_message %}
    <div class="message error">
      <p>{{ error_message }}</p>
    </div>
  {% endif %}

  <form method="POST" action="{{ url_for('add_person') }}">
    <input type="hidden" name="action" value="add">
    <div>
      <label for="new_name">Name:</label>
      <div><input type="text" id="new_name" name="name" required></div>
    </div>
    <br>
    <div>
      <label>Select Audience(s):</label>
      <div class="checkbox-group" id="new_audiences">
        {% for aud in all_audiences %}
          <label>
            <input type="checkbox" name="audiences" value="{{ aud['audience_id'] }}">
            {{ aud['audience_type'] }} [ID: {{ aud['audience_id'] }}]
          </label>
        {% endfor %}
      </div>
    </div>
    <br>
    <div>
      <button type="submit">Add Person</button>
    </div>
  </form>
{% endblock %}
